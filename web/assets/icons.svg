      <path d="M2 8h18a2 2 0 0 1 2 2v10"/>
      <path d="M2 17h20"/>
      <circle cx="6" cy="11" r="2"/>
    </symbol>
    <symbol id="icon-staff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
    <symbol id="icon-virus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="2" x2="12" y2="7"/>
      <line x1="12" y1="17" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="7" y2="12"/>
      <line x1="17" y1="12" x2="22" y2="12"/>
      <line x1="4.93" y1="4.93" x2="8.46" y2="8.46"/>
      <line x1="15.54" y1="15.54" x2="19.07" y2="19.07"/>
      <line x1="4.93" y1="19.07" x2="8.46" y2="15.54"/>
      <line x1="15.54" y1="8.46" x2="19.07" y2="4.93"/>
    </symbol>

    <!-- Abstract Healthcare Motif (Hero Banner Right Side Graphic) -->
    <symbol id="hero-motif" viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="20" y="25" width="200" height="110" rx="10" stroke="#7AD672" stroke-opacity="0.35" stroke-dasharray="6 4"/>
      <line x1="20" y1="55" x2="220" y2="55" stroke="white" stroke-opacity="0.2"/>
      <path d="M40 105 L75 80 L115 95 L160 55 L200 70" stroke="#7AD672" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="75" cy="80" r="4.5" fill="#7AD672"/>
      <circle cx="115" cy="95" r="4.5" fill="#7AD672"/>
      <circle cx="160" cy="55" r="4.5" fill="#7AD672"/>
      <circle cx="200" cy="70" r="4.5" fill="#7AD672"/>
      <line x1="40" y1="120" x2="200" y2="120" stroke="white" stroke-opacity="0.2"/>
      <rect x="40" y="38" width="45" height="8" rx="4" fill="white" fill-opacity="0.25"/>
      <rect x="95" y="38" width="30" height="8" rx="4" fill="#7AD672" fill-opacity="0.4"/>
      <circle cx="195" cy="42" r="5" fill="#7AD672" fill-opacity="0.5"/>
    </symbol>
  </defs>
</svg>
