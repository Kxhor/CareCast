[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carecast"
version = "0.1.0"
description = "Explainable respiratory-admission forecasting and capacity early-warning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kishor G" },
    { name = "Thanujaa P" },
]
license = { text = "MIT" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
